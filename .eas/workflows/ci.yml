name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

jobs:
  typecheck:
    name: Type-check
    type: custom
    steps:
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type-check
        run: bunx tsc --noEmit
