<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Foreground layer of the Android adaptive icon (android.adaptiveIcon.foregroundImage,
       assets/images/adaptive-icon.png): the cream mark of icon-square.svg on a transparent
       background, over the red of android.adaptiveIcon.backgroundColor (#C8102E). The layer is
       108 dp square, and only its centred 66 dp safe zone is never clipped: kept here as a
       66 dp circle, a radius of 1024 × 33 / 108 = 312.9. Unscaled, the stem's corner reaches
       422 from the centre (414 once rounded), so the mark is scaled by 0.72 about the centre:
       422 × 0.72 = 304, inside the safe zone, like icon-monochrome.svg. -->
  <defs><clipPath id="kbox"><rect x="200" y="196" width="700" height="632"/></clipPath></defs>
  <g transform="translate(512 512) scale(0.72) translate(-512 -512)">
    <g clip-path="url(#kbox)">
      <!-- K: stem -->
      <rect x="232" y="196" width="168" height="632" rx="20" fill="#F7F4EF"/>
      <!-- K: arms, 150 wide, cut flat by the clip at the top and bottom of the stem -->
      <g stroke="#F7F4EF" stroke-width="150" stroke-linecap="butt">
        <line x1="330" y1="560" x2="700" y2="170"/>
        <line x1="330" y1="464" x2="700" y2="854"/>
      </g>
    </g>
    <!-- Pelota, in the mouth of the K -->
    <circle cx="716" cy="512" r="96" fill="#F7F4EF"/>
  </g>
</svg>
