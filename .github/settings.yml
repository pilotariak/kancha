---
_extends: .github:.github/settings.yml

# repo-specific settings

repository:
  name: kancha
  description: An iOS and Android application for Pilotariak in React Native
  topics: react-native, android, ios, pilotaria

labels:
  ## AREA

  - name: "area/ios"
    description: "The iOS platform"
    color: "cc317c"

  - name: "area/android"
    description: "The Android platform"
    color: "cc317c"

  ## DEPENDENCY

  - name: "dependency/typescript"
    description: "Dependency Typescript"
    color: "6fcb70"

  - name: "dependency/github-actions"
    description: "Dependency GitHub Actions"
    color: "6fcb70"

  - name: "dependency/npm"
    description: "Dependency NPM"
    color: "6fcb70"

branches:
  - name: main
    protection:
      required_pull_request_reviews:
        required_approving_review_count: 1
        dismiss_stale_reviews: true
        require_code_owner_reviews: true
      required_status_checks:
        strict: true
        contexts:
          - "Lint & Type Check"
      enforce_admins: true
      required_linear_history: true
      restrictions: null
