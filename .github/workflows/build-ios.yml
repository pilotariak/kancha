---
name: Build / iOS

on: # yamllint disable-line rule:truthy
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  build-ios:
    name: EAS Build (iOS preview)
    # EAS remote build runs on Expo's macOS infrastructure — ubuntu-latest is sufficient here.
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 🔒 Harden Runner
        uses: step-security/harden-runner@ec9f2d5744a09debf3a187a3f4f675c53b671911 # v2.13.0
        with:
          egress-policy: audit

      - name: 🚚 Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: 🎉 Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: latest

      - name: 🎉 Setup EAS
        uses: expo/expo-github-action@v8 # TODO: pin to full SHA once Renovate is configured for GitHub Actions
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🔍 Type-check
        run: bunx tsc --noEmit

      - name: 📱 Build iOS (preview)
        run: eas build --platform ios --profile preview --non-interactive
